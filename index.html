<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Dynamic Profile Card</title>
    <style>
        /* बेसिक वेबसाइट का बैकग्राउंड */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* इन्स्टाग्राम खोलने वाला बटन */
        .insta-btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
            transition: 0.3s;
        }

        .insta-btn:hover {
            transform: scale(1.05);
        }

        /* डार्क ओवरले (पीछे का धुंधला हिस्सा) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        /* 🌟 कार्ड का एनीमेशन (नीचे से ऊपर आने वाला) */
        .profile-card {
            background: #1e1e1e;
            width: 350px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(50px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* जब मोडल एक्टिव होगा तब क्या होगा */
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-overlay.active .profile-card {
            transform: translateY(0); /* कार्ड अपनी जगह पर आ जाएगा */
        }

        /* क्लोज बटन (X) */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover { color: white; }

        /* प्रोफाइल पिक्चर और नाम */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #dc2743;
            padding: 2px;
        }

        .header h3 { margin: 0; font-size: 20px; }
        .header p { margin: 3px 0 0; color: #aaa; font-size: 14px; }

        /* फॉलोअर्स और पोस्ट के स्टैट्स */
        .stats {
            display: flex;
            justify-content: space-between;
            text-align: center;
            margin-bottom: 20px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }

        .stats div span {
            display: block;
            font-size: 18px;
            font-weight: bold;
        }

        .stats div small { color: #888; font-size: 12px; }

        /* डमी पोस्ट्स का ग्रिड */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .posts-grid div {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #333;
            border-radius: 5px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .posts-grid div:hover { filter: brightness(1.2); }

    </style>
</head>
<body>

    <!-- यह वह बटन है जिस पर कस्टमर क्लिक करेगा -->
    <button class="insta-btn" onclick="openPopup()">View Instagram Profile</button>

    <!-- पॉपअप कार्ड का स्ट्रक्चर (जो शुरुआत में छिपा रहेगा) -->
    <div class="modal-overlay" id="instaModal" onclick="closePopup(event)">
        
        <div class="profile-card" onclick="event.stopPropagation()">
            <!-- बंद करने का X बटन -->
            <span class="close-btn" onclick="closePopup()">&times;</span>
            
            <!-- प्रोफाइल की जानकारी -->
            <div class="header">
                <img src="https://via.placeholder.com/150/000000/FFFFFF/?text=DP" alt="Profile Picture">
                <div>
                    <h3>@TradeMediaRks</h3>
                    <p>Digital Growth Agency 🚀</p>
                </div>
            </div>

            <!-- स्टैट्स (फॉलोअर्स आदि) -->
            <div class="stats">
                <div><span>124</span><small>Posts</small></div>
                <div><span>45.2K</span><small>Followers</small></div>
                <div><span>180</span><small>Following</small></div>
            </div>

            <!-- डमी इंस्टाग्राम पोस्ट्स (3 फोटो) -->
            <div class="posts-grid">
                <div style="background-image: url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=500&q=80');"></div>
                <div style="background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=500&q=80');"></div>
                <div style="background-image: url('https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?w=500&q=80');"></div>
            </div>
            
        </div>
    </div>

    <!-- JavaScript (लॉजिक जो कार्ड को दिखाएगा और छिपाएगा) -->
    <script>
        const modal = document.getElementById('instaModal');

        // पॉपअप खोलने का फंक्शन
        function openPopup() {
            modal.classList.add('active');
        }

        // पॉपअप बंद करने का फंक्शन
        function closePopup(e) {
            // अगर खाली जगह पर या X पर क्लिक किया है, तो कार्ड बंद कर दो
            if (!e || e.target === modal || e.target.classList.contains('close-btn')) {
                modal.classList.remove('active');
            }
        }
    </script>

</body>
</html>
